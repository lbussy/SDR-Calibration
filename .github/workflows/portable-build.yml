name: Portable hardware-free build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            generator: Ninja
          - os: windows-2025
            generator: Ninja
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure portable core
        run: >-
          cmake -S . -B build/portable -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DSDRCAL_BUILD_GUI=OFF -DSDRCAL_ENABLE_SOAPYSDR=OFF
      - name: Build
        run: cmake --build build/portable --config Release
      - name: Test
        run: ctest --test-dir build/portable -C Release --output-on-failure
      - name: Audit staged package
        run: cmake --build build/portable --config Release --target package-audit
      - name: Create portable archive
        run: cmake --build build/portable --config Release --target package-archive-audit
      - name: Parse Windows packaging scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in 'package-msi.ps1', 'manage-self-signed-certificate.ps1') {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              "$PWD/packaging/windows/$script", [ref]$null, [ref]$errors)
            if ($errors.Count -ne 0) { $errors | Out-String | Write-Error }
          }

  docs:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build documentation with warnings as errors
        run: pip install -r docs/requirements.txt && sphinx-build -W -b html docs docs/_build/html
